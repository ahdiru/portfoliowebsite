<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/Photo.jpeg" />
  <link rel="apple-touch-icon" href="/Photo.jpeg" />
  
  <!-- Preconnect Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- SEO Utama -->
  <title>Ahmad Jordan | Web Developer & Data Analyst</title>
  <meta name="description" content="Portfolio of Ahmad Jordan, Web Developer & Data Analyst. Specializing in end-to-end web platforms, optimized database architecture, and executive business intelligence." />
  <meta name="keywords" content="Ahmad Jordan, Web Developer, Data Analyst, React.js, Python, Supabase, PostgreSQL, Tableau, Jakarta" />
  <meta name="author" content="Ahmad Jordan" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#F5F0E6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ahmad Jordan | Web Developer & Data Analyst" />
  <meta property="og:description" content="Portfolio of Ahmad Jordan. Engineering end-to-end web platforms, database architecture, and business intelligence." />
  <meta property="og:image" content="/Photo.jpeg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ahmad Jordan | Web Developer & Data Analyst" />
  <meta name="twitter:description" content="Portfolio of Ahmad Jordan. Engineering end-to-end web platforms, database architecture, and business intelligence." />
  <meta name="twitter:image" content="/Photo.jpeg" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ahmad Jordan",
    "jobTitle": "Web Developer & Data Analyst",
    "description": "Versatile Web Developer & Data Analyst with a proven track record of engineering end-to-end web platforms, architecting optimized database solutions, and delivering executive business intelligence.",
    "sameAs": [
      "https://www.linkedin.com/in/ahmadjordan",
      "https://bit.ly/Jordansportfolio"
    ]
  }
  </script>
</head>

<body>
  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
